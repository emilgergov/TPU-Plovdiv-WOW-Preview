name: KT79-24 Pinned Final V27.34 Verification
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  pinned-final:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Dependencies
        run: npm install --no-save --no-package-lock --ignore-scripts fflate @xmldom/xmldom
      - name: Immutable release gate
        run: |
          test -s releases/v27.34/index.html
          while read -r hash path; do
            test "$(git hash-object "$path")" = "$hash" || exit 1
          done < releases/v27.34/RELEASE_LOCK.gitblob
          grep -q '/releases/v27.34/assets/kt79-10-universal-word-gate.js' releases/v27.34/index.html
      - name: Combined legal and KT42 impact scenarios
        run: node kt79-24-joint-gate-regression.cjs
      - name: Final Word and identical Classic
        run: |
          mkdir -p /tmp/kt79-final
          cp releases/v27.34/assets/kt79-10-universal-word-gate.js /tmp/kt79-final/kt79-10-universal-word-gate.js
          cp releases/v27.32/assets/kt79-10-universal-word-gate.js /tmp/kt79-final/kt79-22-base-gate.js
          cp kt79-23-universal-regression.cjs /tmp/kt79-final/kt79-10-universal-regression.cjs
          (cd /tmp/kt79-final && NODE_PATH="$GITHUB_WORKSPACE/node_modules" node kt79-10-universal-regression.cjs)
