name: KT79-23 Universal Expert and Classic Typography
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  final-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-save --no-package-lock --ignore-scripts fflate @xmldom/xmldom
      - name: Check pinned V27.33 release assets
        run: |
          test -s releases/v27.33/index.html
          grep -q '/releases/v27.33/assets/kt79-10-universal-word-gate.js' releases/v27.33/index.html
          node --check releases/v27.33/assets/kt79-10-universal-word-gate.js
          node --check kt79-23-universal-regression.cjs
      - name: Test 6 A/B cases, segment whitespace, Classic and Expert
        run: |
          mkdir -p /tmp/kt7923
          cp releases/v27.33/assets/kt79-10-universal-word-gate.js /tmp/kt7923/kt79-10-universal-word-gate.js
          cp releases/v27.32/assets/kt79-10-universal-word-gate.js /tmp/kt7923/kt79-22-base-gate.js
          cp kt79-23-universal-regression.cjs /tmp/kt7923/kt79-10-universal-regression.cjs
          (cd /tmp/kt7923 && NODE_PATH="$GITHUB_WORKSPACE/node_modules" node kt79-10-universal-regression.cjs)
