name: Lightweight WOW Preview Pages

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '*.js'
      - 'releases/**'
      - '.github/workflows/preview-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: lightweight-preview-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare only lightweight preview files
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp kt77-15-classic-b-signature-pagination.js _site/kt77-15-classic-b-signature-pagination.js
          cp kt77-18-verified-admin-bridge.js _site/kt77-18-verified-admin-bridge.js
          cp kt77-21-classic-b-reference-consistent-guard.js _site/kt77-21-classic-b-reference-consistent-guard.js
          test -s _site/index.html
          test -s _site/kt77-15-classic-b-signature-pagination.js
          test -s _site/kt77-18-verified-admin-bridge.js
          test -s _site/kt77-21-classic-b-reference-consistent-guard.js
          cp kt77-23-third-case-pagination.js _site/kt77-23-third-case-pagination.js
          test -s _site/kt77-23-third-case-pagination.js
          cp kt77-23-pdf2-verified-metadata.js _site/kt77-23-pdf2-verified-metadata.js
          test -s _site/kt77-23-pdf2-verified-metadata.js
          cp kt77-23-ai-institutional-style-guard.js _site/kt77-23-ai-institutional-style-guard.js
          test -s _site/kt77-23-ai-institutional-style-guard.js
          cp kt77-24-pdf2-compact-renderer.js _site/kt77-24-pdf2-compact-renderer.js
          test -s _site/kt77-24-pdf2-compact-renderer.js
          cp kt77-24-ai-gis-factual-guard.js _site/kt77-24-ai-gis-factual-guard.js
          test -s _site/kt77-24-ai-gis-factual-guard.js
          cp kt79-01-classic-b-paragraph-23.js _site/kt79-01-classic-b-paragraph-23.js
          test -s _site/kt79-01-classic-b-paragraph-23.js
          node --check _site/kt79-01-classic-b-paragraph-23.js
          cp kt79-05-approved-final-docx-pass.js _site/kt79-05-approved-final-docx-pass.js
          test -s _site/kt79-05-approved-final-docx-pass.js
          node --check _site/kt79-05-approved-final-docx-pass.js
          grep -q 'KT79FinalApproved.fix(kt7713.blob)' _site/index.html
          cp kt79-10-universal-word-gate.js _site/kt79-10-universal-word-gate.js
          test -s _site/kt79-10-universal-word-gate.js
          node --check _site/kt79-10-universal-word-gate.js
          # Test actual XML paragraph/run mutation on synthetic A/B/B+ZT packages.
          mkdir -p /tmp/kt79-regression
          npm install --prefix /tmp/kt79-regression --no-save --silent fflate@0.8.2 @xmldom/xmldom@0.8.12
          NODE_PATH=/tmp/kt79-regression/node_modules node kt79-10-universal-regression.cjs
          grep -q 'kt79-10-universal-word-gate.js' _site/index.html
          # V27.28 is a pinned release: publish ALL local runtime assets together.
          # Never alter the heavy WOW site: this is a separate small Pages artifact.
          test -s releases/v27.28/index.html
          test -s releases/v27.28/RELEASE_LOCK.gitblob
          while read -r expected filepath; do
            test -f "$filepath"
            actual=$(git hash-object "$filepath")
            test "$actual" = "$expected" || { echo "::error::Locked release changed: $filepath"; exit 1; }
          done < releases/v27.28/RELEASE_LOCK.gitblob
          # V27.29 is pinned separately; it shares only locked V27.28 dependencies.
          test -s releases/v27.29/index.html
          test -s releases/v27.29/RELEASE_LOCK.gitblob
          while read -r expected filepath; do
            test -f "$filepath"
            actual=$(git hash-object "$filepath")
            test "$actual" = "$expected" || { echo "::error::V27.29 release changed: $filepath"; exit 1; }
          done < releases/v27.29/RELEASE_LOCK.gitblob
          grep -q '/releases/v27.29/assets/kt79-10-universal-word-gate.js' releases/v27.29/index.html
          ! grep -q 'kt79-05-approved-final-docx-pass.js' releases/v27.29/index.html
          node --check releases/v27.29/assets/kt79-10-universal-word-gate.js
          # KT79-21: final V27.31 is immutable and passed the expanded editorial regression.
          test -s releases/v27.31/index.html
          test -s releases/v27.31/RELEASE_LOCK.gitblob
          while read -r expected filepath; do
            test -f "$filepath"
            actual=$(git hash-object "$filepath")
            test "$actual" = "$expected" || { echo "::error::V27.31 release changed: $filepath"; exit 1; }
          done < releases/v27.31/RELEASE_LOCK.gitblob
          grep -q '/releases/v27.31/assets/kt79-10-universal-word-gate.js' releases/v27.31/index.html
          node --check releases/v27.31/assets/kt79-10-universal-word-gate.js
          mkdir -p /tmp/kt79-final
          cp releases/v27.31/assets/kt79-10-universal-word-gate.js /tmp/kt79-final/kt79-10-universal-word-gate.js
          cp kt79-21-final-regression.cjs /tmp/kt79-final/kt79-10-universal-regression.cjs
          (cd /tmp/kt79-final && NODE_PATH=/tmp/kt79-regression/node_modules node kt79-10-universal-regression.cjs)

          # KT79-22: verify immutable V27.32 release and universal Classic B normalization.
          test -s releases/v27.32/index.html
          test -s releases/v27.32/RELEASE_LOCK.gitblob
          while read -r expected filepath; do
            test -f "$filepath"
            actual=$(git hash-object "$filepath")
            test "$actual" = "$expected" || { echo "::error::V27.32 release changed: $filepath"; exit 1; }
          done < releases/v27.32/RELEASE_LOCK.gitblob
          grep -q '/releases/v27.32/assets/kt79-10-universal-word-gate.js' releases/v27.32/index.html
          node --check releases/v27.32/assets/kt79-10-universal-word-gate.js
          mkdir -p /tmp/kt79-22
          cp releases/v27.32/assets/kt79-10-universal-word-gate.js /tmp/kt79-22/kt79-10-universal-word-gate.js
          cp kt79-22-final-regression.cjs /tmp/kt79-22/kt79-10-universal-regression.cjs
          (cd /tmp/kt79-22 && NODE_PATH=/tmp/kt79-regression/node_modules node kt79-10-universal-regression.cjs)

          cp -R releases _site/releases
          python3 - <<'PY'
          from pathlib import Path
          import re
          html=Path('_site/releases/v27.28/index.html').read_text()
          base='<base href="https://emilgergov.github.io/TPU-Plovdiv-WOW-2.0/v26-test/">'
          assert base in html, 'Base URL must point at pre-existing stable WOW data'
          refs=re.findall(r'src="(/TPU-Plovdiv-WOW-Preview/releases/v27[.]28/assets/[^"]+)',html)
          assert len(refs)==8, f'Expected 8 pinned release JS references, got {len(refs)}'
          for ref in refs:
              relative=ref.split('?',1)[0].removeprefix('/TPU-Plovdiv-WOW-Preview/')
              assert Path('_site',relative).is_file(), f'Missing release dependency {relative}'
          print('PASS: 8/8 versioned runtime dependencies present')
          PY
          for script in _site/releases/v27.28/assets/*.js; do node --check "$script"; done
          test "$(du -sb _site | awk '{print $1}')" -lt 5242880 || { echo "::error::Lightweight Pages bundle is unexpectedly larger than 5 MB"; exit 1; }
          du -sh _site
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload lightweight artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v4
